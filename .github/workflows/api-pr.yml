name: Api PR Validation

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/dsaster-search/**'
      - ".github/workflows/api-pr.yml"
      - ".github/actions/setup-api/**"
  workflow_dispatch:

jobs:
  format-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'src/dsaster-search'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-api

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'src/dsaster-search'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-api

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: e2e tests
        run: pnpm test:e2e
    
  openapi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'src/dsaster-search'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-api

      - name: Verify OpenAPI spec
        run: |
          pnpm api openapi.ci.json
          if ! diff -u --strip-trailing-cr \
            ./openapi/openapi.json \
            ./openapi/openapi.ci.json; then
            echo "::error file=openapi/openapi.json::OpenAPI spec is out of date. Regenerate and commit the updated file."
            exit 1
          fi
